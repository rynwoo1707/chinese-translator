# PDF layout service behind Caddy (automatic HTTPS) on one server. Run from this folder, with a .env made from
# env.example:  docker compose up -d --build   (README.md has the whole runbook).
name: hoa-tri-pdf

services:
  pdf-layout:
    build:
      context: ../..
      dockerfile: services/pdf-layout/Dockerfile
    image: hoa-tri-pdf-layout:local
    # Started again whenever it stops: a crash, an out-of-memory kill, a reboot, or the health check below.
    restart: unless-stopped
    # tini reaps the Chromium and Python children of every job, and passes the health check's stop on to the service.
    init: true
    environment:
      PDF_LAYOUT_SERVICE_TOKEN: ${PDF_LAYOUT_SERVICE_TOKEN:?Đặt PDF_LAYOUT_SERVICE_TOKEN trong .env (openssl rand -hex 32)}
      # Jobs at once; keep the Worker's PDF_LAYOUT_SLOTS (wrangler.jsonc vars) at the same number.
      PDF_LAYOUT_JOBS: ${PDF_LAYOUT_JOBS:-2}
      PDF_HEALTH_RESTART_AFTER: ${PDF_HEALTH_RESTART_AFTER:-4}
      # Seconds one extraction may use (extract.py): the pages done by then are answered and the rest left for the next
      # run. Keep it below the 240 s at which the engine stops the Python process.
      PDF_EXTRACT_SECONDS: ${PDF_EXTRACT_SECONDS:-170}
    # GET /health with the token every 15 s. Docker itself never restarts a container that is only unhealthy, so after 4
    # failures in a row (about a minute) healthcheck.mjs stops the service and restart: unless-stopped starts it again.
    healthcheck:
      test: ["CMD", "node", "services/pdf-layout/healthcheck.mjs", "/health", "PDF_LAYOUT_SERVICE_TOKEN"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Reachable only by Caddy on the compose network: no published port.
    expose:
      - "8091"
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    tmpfs:
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Two jobs at once, each with a headless Chromium. Lower PDF_LAYOUT_CPUS/MEMORY in .env on a smaller server.
    deploy:
      resources:
        limits:
          cpus: "${PDF_LAYOUT_CPUS:-2}"
          memory: ${PDF_LAYOUT_MEMORY:-3g}
          pids: 1024
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      pdf-layout:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PDF_DOMAIN: ${PDF_DOMAIN:?Đặt PDF_DOMAIN trong .env (ví dụ pdf.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?Đặt ACME_EMAIL trong .env (email nhận thông báo chứng chỉ)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account: keep this volume, or every restart asks for new certificates.
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
