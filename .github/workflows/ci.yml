# Tests, the Worker bundle and the PDF service image on every push and pull request. Uses no repository secrets and
# never calls Gemini or Cloudflare: npm test runs with backend/test-support/no-paid-api.mjs preloaded, and the Worker
# is only built with --dry-run. Actions are pinned to commit SHAs (the repository is public).
name: CI

on:
  push:
    branches: [main, "handoff/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: npm test and Worker dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No local secrets or user files in the repository
        run: |
          tracked="$(git ls-files)"
          found="$(printf '%s\n' "$tracked" | grep -E '(^|/)(\.dev\.vars(\..+)?|\.env(\..+)?)$' | grep -vx '\.dev\.vars\.example' || true)"
          if [ -n "$found" ]; then echo "::error::Local secret files are committed: $found"; exit 1; fi
          found="$(printf '%s\n' "$tracked" | grep -E '^(\.wrangler|\.runtime|samples|tmp|output)/' || true)"
          if [ -n "$found" ]; then echo "::error::Local data is committed: $found"; exit 1; fi
          # -l prints file names only, so a leaked key is not copied into this public log.
          if git grep -lIE 'AIza[0-9A-Za-z_-]{35}'; then echo "::error::A Google API key is committed in the files above"; exit 1; fi
          if git grep -lIE -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----'; then echo "::error::A private key is committed in the files above"; exit 1; fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pdf-layout/requirements.txt

      - run: npm ci

      # The PaddleOCR models come from Baidu BOS with pinned SHA-256s; the cache spares that download on most runs.
      - name: Cache PaddleOCR models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/vendor/paddle/models
          key: paddle-${{ hashFiles('backend/prepare-paddle-models.mjs') }}

      - name: PaddleOCR models
        timeout-minutes: 10
        run: test -f frontend/vendor/paddle/models/det.tar -a -f frontend/vendor/paddle/models/rec.tar || npm run prepare:ocr

      - run: npm run prepare:vendor

      - name: PyMuPDF and OCR data for the Python-backed tests
        run: |
          python -m pip install --disable-pip-version-check --target .runtime/pdf-python -r services/pdf-layout/requirements.txt
          npm run prepare:pdf-ocr

      - name: Browser and font for the PDF engine test; Edge-only tests skip
        run: |
          # Puppeteer renders with the runner's Chromium (or Chrome); DejaVu Serif is the PDF font on Linux.
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$browser" ]; then echo "::error::No Chromium or Chrome on this runner"; exit 1; fi
          echo "CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf || { sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core; }
          # book-ui.test.mjs measures layouts in Microsoft Edge as on Windows and skips without it; the image ships Edge.
          sudo rm -rf /opt/microsoft/msedge

      - name: npm test (paid APIs blocked)
        shell: bash
        env:
          PDF_PYTHON: python
          PDF_CHROMIUM_NO_SANDBOX: "1"
          NODE_OPTIONS: --import=${{ github.workspace }}/backend/test-support/no-paid-api.mjs
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
          # A skipped Python-backed test means the setup above broke: fail rather than pass with less coverage.
          if grep -n 'needs Python' "$RUNNER_TEMP/npm-test.log"; then echo "::error::Python-backed tests were skipped"; exit 1; fi

      - name: Worker bundle (wrangler deploy --dry-run, no Cloudflare login)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  pdf-image:
    name: PDF service image, smoke test and HTTPS proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Caddy serves localhost with certificates from its own local CA: no ACME request leaves the runner.
      PDF_DOMAIN: localhost
      ACME_EMAIL: ci@example.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deployment files (docker-compose.yml, Caddyfile for a public domain)
        working-directory: deploy/pdf-layout
        env:
          PDF_DOMAIN: pdf.example.org
        run: |
          PDF_LAYOUT_SERVICE_TOKEN="$(openssl rand -hex 32)" docker compose config --quiet
          image="$(sed -n 's/^ *image: *\(caddy:.*\)$/\1/p' docker-compose.yml)"
          docker run --rm -e PDF_DOMAIN -e ACME_EMAIL -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tagged as docker-compose.yml names the image, so compose below runs this build.
      - name: Build services/pdf-layout/Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/pdf-layout/Dockerfile
          tags: hoa-tri-pdf-layout:local
          load: true
          push: false
          cache-from: type=gha,scope=pdf-layout
          cache-to: type=gha,scope=pdf-layout,mode=max

      - name: Start the service with the limits of docker-compose.yml
        run: |
          PDF_LAYOUT_SERVICE_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$PDF_LAYOUT_SERVICE_TOKEN"
          echo "PDF_LAYOUT_SERVICE_TOKEN=$PDF_LAYOUT_SERVICE_TOKEN" >> "$GITHUB_ENV"
          export PDF_LAYOUT_SERVICE_TOKEN
          docker run -d --name pdf-layout --init --shm-size=1g --tmpfs /tmp:size=1g --pids-limit 1024 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e PDF_LAYOUT_SERVICE_TOKEN -p 127.0.0.1:8091:8091 hoa-tri-pdf-layout:local

      - name: Healthy by its own HEALTHCHECK, not root, token required
        run: |
          health=starting
          for _ in $(seq 1 45); do
            health="$(docker inspect --format '{{.State.Health.Status}}' pdf-layout)"
            if [ "$health" = healthy ] || [ "$health" = unhealthy ]; then break; fi
            sleep 2
          done
          echo "HEALTHCHECK: $health"
          test "$health" = healthy
          test "$(docker exec pdf-layout id -u)" != 0
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/health)" = 401
          curl -fsS -H "Authorization: Bearer $PDF_LAYOUT_SERVICE_TOKEN" http://127.0.0.1:8091/health

      - name: Smoke test inside the container (extract, render, verify.py, OCR of a scan; no Gemini)
        run: docker exec pdf-layout node services/pdf-layout/smoke.mjs http://127.0.0.1:8091 /tmp/smoke

      - name: docker-compose.yml with Caddy in front (HTTPS, routes, body size)
        working-directory: deploy/pdf-layout
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          ca="$RUNNER_TEMP/caddy-root.crt" ready=
          for _ in $(seq 1 30); do
            if docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$ca" 2>/dev/null &&
              [ "$(curl -s --cacert "$ca" -o /dev/null -w '%{http_code}' https://localhost/health)" = 401 ]; then ready=1; break; fi
            sleep 2
          done
          test -n "$ready"
          status() { curl -s --cacert "$ca" -o "$RUNNER_TEMP/body" -w '%{http_code}' -H "Authorization: Bearer $PDF_LAYOUT_SERVICE_TOKEN" "$@"; }
          test "$(status https://localhost/health)" = 200
          test "$(status https://localhost/font)" = 200
          grep -q '@font-face' "$RUNNER_TEMP/body"
          test "$(status https://localhost/other)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/health)" = 308
          # 39 MiB of JSON (the service takes up to 40 MiB) must reach the service whole: it answers with its own
          # validation error, not Caddy's 413 or the service's size message.
          { printf '{"document":"'; head -c $((39 * 1024 * 1024)) /dev/zero | tr '\0' x; printf '"}'; } > "$RUNNER_TEMP/big.json"
          test "$(status -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/big.json" https://localhost/render)" = 422
          if grep -q 'vượt giới hạn' "$RUNNER_TEMP/body"; then cat "$RUNNER_TEMP/body"; exit 1; fi
          echo "Caddy: HTTPS, 401/200/404, redirect and a 39 MiB body all behave."

      - name: Collect the smoke output
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-smoke"
          docker exec pdf-layout tar -C /tmp/smoke -cf - . | tar -C "$RUNNER_TEMP/pdf-smoke" -xf - || true

      - name: Upload the rendered pages (generated test PDF only)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-smoke
          path: ${{ runner.temp }}/pdf-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Service and proxy logs
        if: failure()
        working-directory: deploy/pdf-layout
        run: |
          docker logs pdf-layout || true
          docker compose logs --no-color || true
